services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saasbot
      POSTGRES_PASSWORD: saasbot
      POSTGRES_DB: saasbot_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saasbot
      POSTGRES_PASSWORD: saasbot
      POSTGRES_DB: saasbot_test
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
