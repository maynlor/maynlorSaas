services:
  postgres:
    # pgvector/pgvector es postgres:16 + la extension "vector" preinstalada
    # (necesaria para las busquedas semanticas del RAG). Supabase la soporta
    # nativamente, asi que no hay divergencia con produccion.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: saasbot
      POSTGRES_PASSWORD: saasbot
      POSTGRES_DB: saasbot_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-test:
    # pgvector/pgvector es postgres:16 + la extension "vector" preinstalada
    # (necesaria para las busquedas semanticas del RAG). Supabase la soporta
    # nativamente, asi que no hay divergencia con produccion.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: saasbot
      POSTGRES_PASSWORD: saasbot
      POSTGRES_DB: saasbot_test
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
