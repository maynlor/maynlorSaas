# Blueprint de Render para la plataforma.
#
# La base de datos NO se declara acá: vive en Supabase, y su cadena de conexión
# se carga como secreto (`DATABASE_URL`) desde el panel de Render.
#
# Todo lo marcado con `sync: false` es un secreto o un valor propio del entorno:
# Render lo pide al crear el blueprint y nunca queda en el repositorio.
#
# NOTA TEMPORAL: los servicios web están en plan `free` (sin tarjeta cargada
# todavía) para verificar el primer deploy. El free se duerme tras 15 min sin
# tráfico y tarda en despertar — antes de conectar Mercado Pago o WhatsApp de
# verdad hay que volver esto a `starter`, porque un webhook que llega mientras
# el servicio duerme se pierde. El servicio de Redis se sacó del blueprint
# para este trial (Key Value no tiene plan free en Render); sin REDIS_URL el
# rate limiting cae a memoria por instancia, que alcanza en free porque no
# escala a más de una instancia. Volver a agregarlo junto con el upgrade a
# starter.
services:
  - type: web
    name: saasbot-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # `preDeployCommand` no está disponible en plan free, así que las
    # migraciones van al final del build en vez de un paso separado antes del
    # deploy. Sigue siendo seguro con `runMigrations` tomando un advisory lock
    # de Postgres (dos builds simultáneos no aplicarían la misma migración a
    # la vez). Al volver a plan starter, se puede mover de nuevo a
    # preDeployCommand si se prefiere separar build de migración.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter backend build && pnpm --filter backend migrate:prod
    startCommand: pnpm --filter backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      # Postgres de Supabase. Usar la cadena del "connection pooler" (puerto
      # 6543): Render escala a varias instancias y el puerto directo agota
      # rápido el límite de conexiones de Supabase.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # "lax" sirve cuando el frontend comparte dominio con la API
      # (app.tudominio.com + api.tudominio.com). Si quedan en dominios
      # distintos hay que poner "none", o el navegador no enviará la cookie.
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      # Origen exacto del frontend, para CORS con credenciales.
      - key: WEB_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      # Credenciales de PRODUCCIÓN de Mercado Pago. Si se define el token, el
      # secreto del webhook es obligatorio: sin él la aplicación no arranca,
      # porque no podría distinguir una notificación real de una falsificada.
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      # A dónde vuelve el negocio tras autorizar el pago. Debe ser HTTPS.
      - key: MERCADOPAGO_BACK_URL
        sync: false
      - key: RATE_LIMIT_API_MAX
        value: 300
      - key: RATE_LIMIT_AUTH_MAX
        value: 20
      - key: RATE_LIMIT_WEBHOOK_MAX
        value: 600
      # Sin REDIS_URL el rate limiting cae a memoria por instancia. Ver nota
      # temporal arriba: se reactiva cuando se vuelva a plan starter.

  - type: web
    name: saasbot-web
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      - key: NODE_ENV
        value: production
      # `next start` toma el puerto de PORT; por eso el script no lo fija.
      - key: PORT
        value: 10000
      # Next.js incrusta las NEXT_PUBLIC_* en el bundle durante el build, así
      # que cambiar este valor exige volver a desplegar, no basta reiniciar.
      - key: NEXT_PUBLIC_API_URL
        sync: false
